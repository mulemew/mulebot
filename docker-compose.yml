# docker compose up -d
#
# The memory limit is the important line: the bot reads it through the cgroup
# and picks its cache profile from it, so there is nothing else to tune.

services:
  bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped

    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      # Optional. Leave unset to register commands globally.
      GUILD_ID: ${GUILD_ID:-}
      OWNER_IDS: ${OWNER_IDS:-}

    # 256 MB hard ceiling. This single line is the whole memory configuration:
    # the bot reads it from the cgroup and sizes its V8 heap and caches to fit.
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 1.0

    volumes:
      # Guild settings, member records, cases, scheduled tasks. Back this up.
      - bot-data:/app/data
      # Drop .js files in ./plugins on the host to add plugins without
      # rebuilding. Writable, because /plugin install, upload and npm all write
      # here - mounted read-only they fall back to a scratch directory and
      # every install is lost on the next restart.
      - ./plugins:/app/plugins

    # Only needed if you enable the healthz plugin (PLUGINS_ALLOW=healthz) and
    # want its endpoint reachable from outside. It follows PORT.
    # ports:
    #   - "127.0.0.1:3000:3000"

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  bot-data:
